name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 09:00 UTC — well under the 7-day inactivity window
    - cron: '0 9 */3 * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://wqzqzsfnpsunddijeecb.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
