name: Keep Supabase Alive
 
on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch: {}
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check (no key required)
        run: |
          echo "Health endpoint status:"
          curl -s -o /dev/null -w "%{http_code}\n" \
            "https://wqzqzsfnpsunddijeecb.supabase.co/auth/v1/health"
 
      - name: Ping REST endpoint with anon key
        run: |
          echo "REST endpoint status (anon key):"
          curl -s -o /dev/null -w "%{http_code}\n" \
            "https://wqzqzsfnpsunddijeecb.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Key length check (should be 200+ characters):"
          echo -n "${{ secrets.SUPABASE_ANON_KEY }}" | wc -c
